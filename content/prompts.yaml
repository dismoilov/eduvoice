# Service phrases, Uzbek only. The bridge synthesises them once and keeps the audio
# (`make voice-prewarm`), so an edit here costs one synthesis and then nothing.
#
# `ivr_menu` is no longer played to anyone: dialling 7000 goes straight to the
# assistant. It is kept because `voice_tools ivr` still builds the Asterisk sound file
# from it, should a menu ever be wanted again.

ivr_menu: >-
  Oliy taʼlim vazirligiga xush kelibsiz.
  Yordamchi bilan gaplashish uchun bir raqamini bosing.
  Operator bilan bogʻlanish uchun nol raqamini bosing.

greeting: >-
  Assalomu alaykum! Oliy taʼlim vazirligi yordamchisiman.
  Suhbat yozib olinadi, savolingizni ayting.

filler: Bir daqiqa, tekshiryapman.

anything_else: Yana savolingiz bormi?

repeat_please: Kechirasiz, eshitmadim. Iltimos, savolingizni qaytaring.

not_understood: Kechirasiz, savolingizni tushunmadim.

out_of_scope: Men faqat oliy taʼlim masalalari boʻyicha javob bera olaman.

reprompt: Savolingizni ayting.

transfer: Sizni operatorga ulayman, kutib turing.

tech_problem: Texnik nosozlik. Sizni operatorga ulayman.

goodbye: Qoʻngʻiroq uchun rahmat. Sogʻ boʻling.
