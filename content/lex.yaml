# The regulations the assistant is allowed to answer from, beyond the six FAQ entries.
#
# Each id is the document's own number on lex.uz: https://lex.uz/uz/docs/<id>.
# `make lex-fetch` downloads them, splits them into clauses and indexes them locally;
# nothing here is read during a call, only the database is.
#
# The first three are the decrees the FAQ answers already cite, so a question the FAQ
# does not cover is answered from the same document the FAQ would have quoted.
#
# To add a document: open it on lex.uz, copy the number out of the address bar, add it
# here with a comment, and run `make lex-fetch`.

