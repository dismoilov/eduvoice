; EduVoice: human operators that take over from the AI agent.
; Source of truth: this file lives in the repository and is copied to
; /etc/asterisk/queues_custom.conf by `make deploy-dialplan`.
[eduvoice-operators]
strategy=ringall
timeout=20
retry=3
joinempty=yes
leavewhenempty=no
ringinuse=no
member => PJSIP/200
