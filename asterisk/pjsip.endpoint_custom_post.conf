; ----------------------------------------------------------------------------
; EduVoice — codecs for the telephones that reach the assistant.
; Source of truth: this file lives in the repository and is copied to
; /etc/asterisk/pjsip.endpoint_custom_post.conf by `make deploy-dialplan`.
;
; Narrowband only. A softphone offered G.722 will take it, and G.722 has exactly the
; byte rate of G.711 — 8000 bytes a second — so the bridge, told "ulaw" by the dialplan,
; decoded G.722 as ulaw and heard a constant roar with the caller's voice buried in it.
; A real telephone line is G.711 anyway; this makes the test phones behave like one.
; ----------------------------------------------------------------------------

[101](+)
disallow=all
allow=ulaw,alaw

[102](+)
disallow=all
allow=ulaw,alaw

[200](+)
disallow=all
allow=ulaw,alaw
