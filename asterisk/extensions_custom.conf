; ----------------------------------------------------------------------------
; EduVoice — AI voice operator for the Ministry of Higher Education call centre.
; Source of truth: this file lives in the repository and is copied to
; /etc/asterisk/extensions_custom.conf by `make deploy-dialplan`.
;
; Audio goes to the bridge over AudioSocket (8 kHz, audio only).
; Call data and decisions go over HTTP, because AudioSocket carries neither
; channel variables nor DTMF.
; ----------------------------------------------------------------------------

[from-internal-custom]
; 7777 — echo test: proves a softphone's audio path works
exten => 7777,1,NoOp(EduVoice echo test)
 same => n,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; 7000 — call the assistant. No menu: offered the choice, people press 0 out of habit
; and never hear the assistant at all. Asking for an operator by voice still works, and
; the assistant hands over by itself whenever it cannot help.
exten => 7000,1,Goto(eduvoice-ai,s,1)

; 300 — human operators
exten => 300,1,Goto(eduvoice-operators,s,1)

[eduvoice-entry]
; Uzbek IVR: 1 = assistant, 0 = operator. Digits are read here because they never
; reach the bridge. Until the Uzbek menu has been synthesised, a built-in sound is used.
exten => s,1,NoOp(EduVoice IVR)
 same => n,Answer()
 same => n,Set(TIMEOUT(digit)=3)
 same => n,Set(EDUVOICE_MENU=${IF($[${STAT(e,/var/lib/asterisk/sounds/en/custom/eduvoice-ivr-menu.wav)}]?custom/eduvoice-ivr-menu:demo-thanks)})
 same => n,Background(${EDUVOICE_MENU})
 same => n,WaitExten(4)
exten => 1,1,Goto(eduvoice-ai,s,1)
exten => 0,1,Goto(eduvoice-operators,s,1)
exten => t,1,Goto(eduvoice-ai,s,1)        ; no key pressed -> assistant
exten => i,1,Goto(eduvoice-ai,s,1)        ; wrong key -> assistant

[eduvoice-ai]
; The UUID is created here so the context can also be called directly (tests).
exten => s,1,NoOp(EduVoice AI agent, caller ${CALLERID(num)})
 same => n,Answer()
 same => n,Set(EDUVOICE_UUID=${SHELL(uuidgen | tr -d '\n')})
 ; EDUVOICE_BRIDGE comes from globals_custom.conf; the fallback keeps the context working
 ; even if that file was not deployed
 same => n,ExecIf($["${EDUVOICE_BRIDGE}" = ""]?Set(EDUVOICE_BRIDGE=127.0.0.1:9092))
 same => n,Set(CURLOPT(conntimeout)=1)
 same => n,Set(CURLOPT(httptimeout)=2)
 ; the audio format goes with it: AudioSocket carries no metadata, and a real telephone
 ; negotiates G.711 while a Local/ test channel is linear
 same => n,Set(EDUVOICE_STARTED=${CURL(http://127.0.0.1:9093/calls/${EDUVOICE_UUID}/start,caller=${CALLERID(num)}&format=${CHANNEL(audioreadformat)})})
 same => n,MixMonitor(eduvoice/${STRFTIME(${EPOCH},,%Y%m%d)}/${EDUVOICE_UUID}.wav)
 ; Dial(AudioSocket/...) instead of the AudioSocket() application: when the bridge dies
 ; mid-call the application hangs the caller up, while Dial with the g option lets the
 ; dialplan continue and hand the caller to a human (verified on the server 18.09).
 same => n,Dial(AudioSocket/${EDUVOICE_BRIDGE}/${EDUVOICE_UUID},,g)
 same => n,Set(EDUVOICE_NEXT=${CURL(http://127.0.0.1:9093/calls/${EDUVOICE_UUID}/next)})
 same => n,NoOp(EduVoice decision: ${EDUVOICE_NEXT})
 ; anything other than an explicit hangup goes to a human — including bridge failure
 same => n,GotoIf($["${EDUVOICE_NEXT}" = "hangup"]?bye)
 same => n,Goto(eduvoice-operators,s,1)
 same => n(bye),Hangup()

[eduvoice-operators]
exten => s,1,NoOp(EduVoice transfer to operators)
 same => n,Answer()
 same => n,Queue(eduvoice-operators,t,,,300)
 same => n,Hangup()

[eduvoice-demo]
; Lets a simulated call carry a phone number, so the CRM builds the same citizen card
; it would for a real caller:
;   asterisk -rx "channel originate Local/998901234567@eduvoice-demo/n extension q<sound>@eduvoice-test"
exten => _X.,1,NoOp(EduVoice demo caller ${EXTEN})
 same => n,Set(CALLERID(num)=${EXTEN})
 same => n,Goto(eduvoice-ai,s,1)

[eduvoice-test]
; Automated call test: waits for the greeting, plays a recorded question, listens.
;   asterisk -rx "channel originate Local/s@eduvoice-ai/n extension q<sound>@eduvoice-test"
exten => _q.,1,NoOp(EduVoice test caller: ${EXTEN:1})
 same => n,Answer()
 ; wait for the greeting to finish, then ask, then listen to the answer
 same => n,Wait(12)
 ; a recording from custom/ if it exists, otherwise a built-in Asterisk sound
 same => n,Set(EDUVOICE_SND=${IF($[${STAT(e,/var/lib/asterisk/sounds/en/custom/${EXTEN:1}.wav)}]?custom/${EXTEN:1}:${EXTEN:1})})
 same => n,Playback(${EDUVOICE_SND})
 same => n,Wait(25)
 same => n,Hangup()

; b<sound>: the caller speaks while the bot is still greeting — barge-in test
exten => _b.,1,NoOp(EduVoice barge-in test: ${EXTEN:1})
 same => n,Answer()
 same => n,Wait(2)
 same => n,Set(EDUVOICE_SND=${IF($[${STAT(e,/var/lib/asterisk/sounds/en/custom/${EXTEN:1}.wav)}]?custom/${EXTEN:1}:${EXTEN:1})})
 same => n,Playback(${EDUVOICE_SND})
 same => n,Wait(25)
 same => n,Hangup()

[eduvoice-testagent]
; Stand-in for a human operator: answers the queue call so transfers can be tested
; without a registered softphone.
exten => agent,1,NoOp(EduVoice test agent answered)
 same => n,Answer()
 same => n,Wait(30)
 same => n,Hangup()
