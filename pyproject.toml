[project]
name = "eduvoice"
version = "0.1.0"
description = "AI voice operator for the Ministry of Higher Education call centre"
requires-python = ">=3.12"
dependencies = [
    # Versions pinned by the server: Sangoma Linux 7 has glibc 2.17,
    # numpy >= 2.3 and soxr >= 1 have no wheels for it.
    "numpy>=2.2,<2.3",
    "soxr>=0.5,<1",
    "webrtcvad-wheels>=2.0.14",
    "websockets>=17",
    "httpx>=0.28",
    "python-dotenv>=1.1",
    "pyyaml>=6.0.3",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8",
    "pytest-asyncio>=1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.14",
]

# Flat layout, no build step: the app runs from the repository root
# (python -m eduvoice.main) both locally and on the server.
[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# A call test that hangs must fail, not run forever. Without this a broken bridge made
# the suite — and `make deploy`, which runs it first — stall instead of going red.
timeout = 60

[tool.ruff]
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Correct Uzbek orthography: oʻ/gʻ use U+02BB, tutuq belgisi is U+02BC.
# Russian comments use en dashes and guillemets. None of these are typos.
allowed-confusables = ["ʻ", "ʼ", "–", "—", "«", "»", "С", "с", "е", "о", "а", "р", "х", "у",
                       "В", "Н", "У", "К", "М", "Т", "А", "Р", "Е", "О", "Х", "Ё", "З", "б"]

[tool.ruff.lint.per-file-ignores]
# FastAPI declares dependencies in argument defaults: that is the framework's own style.
"crm/**" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["eduvoice", "store", "crm"]

[tool.mypy]
python_version = "3.12"
files = ["eduvoice", "store", "crm"]
# The providers (VoiceLab, webrtcvad, soxr) ship no type stubs.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
